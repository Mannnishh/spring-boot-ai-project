spring.config.import=optional:file:.env[.properties]
spring.application.name=spring-boot-ai-project
#PostgreSQL Datasource (reads dynamically from environment variables)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate: Automatically creates/updates the 'document' database table
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#Groq (OpenAI-compatible) AI Chat Configuration
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.chat.model=openai/gpt-oss-120b
spring.ai.openai.chat.options.model=openai/gpt-oss-120b